<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>예매 내역</title>

  <style>
    * {
        box-sizing: border-box;
        font-family: "Apple SD Gothic Neo", sans-serif;
    }

    body {
        margin: 0;
        background: #f4f7fb;
        color: #222;
    }

    header {
        height: 70px;
        background: white;
        border-bottom: 1px solid #eee;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 70px;
    }

.logo {
    text-decoration: none;
    font-size: 26px;
    font-weight: bold;
    color: #2563eb;
}

    nav a {
        margin-left: 30px;
        text-decoration: none;
        color: #333;
        font-weight: bold;
    }

    .container {
        max-width: 1000px;
        margin: 50px auto;
    }

    h1 {
        margin-bottom: 30px;
    }

    .ticket {
        background: white;
        border-radius: 20px;
        padding: 30px;
        margin-bottom: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .ticket-info {
        line-height: 1.9;
    }

    .ticket-info h2 {
        margin-bottom: 10px;
    }

    .status {
        color: #2563eb;
        font-weight: bold;
    }

    .cancel-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 12px;
        background: #ef4444;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .cancel-btn:hover {
        background: #dc2626;
    }
  </style>
</head>

<body>

<header>
  <a href="mainpage.html" class="logo">QuickTicket</a>
  <nav>
    <a href="main.html">홈</a>
    <a href="login.html">로그인</a>
    <a href="signup.html">회원가입</a>
    <a href="#">고객센터</a>
  </nav>
</header>

<div class="container">
  <h1>예매 내역</h1>

</div>

<script>
  const userId = localStorage.getItem("userId");
  const container = document.querySelector(".container");

  if (!userId) {
      alert("로그인 후 이용할 수 있습니다.");
      location.href = "login.html";
  }

  async function loadBookings() {
      const response = await fetch(`/bookings/user/${userId}`);
      const bookings = await response.json();

      container.innerHTML = "<h1>예매 내역</h1>";

      if (bookings.length === 0) {
          container.innerHTML += "<p>예매 내역이 없습니다.</p>";
          return;
      }

      bookings.forEach(booking => {
          const performance = booking.performance;
          const seats = booking.seats || [];

          const seatNames = seats.map(s => s.seatNumber).join(", ");
          const totalPrice = seats.reduce((sum, s) => sum + s.price, 0);

          const date = performance.performanceDate
              ? new Date(performance.performanceDate).toLocaleString("ko-KR")
              : "-";

          const ticket = document.createElement("div");
          ticket.className = "ticket";

          ticket.innerHTML = `
              <div class="ticket-info">
                <h2>${performance.title}</h2>
                예매번호 : ${booking.bookingId}<br>
                공연일자 : ${date}<br>
                공연장소 : ${performance.place}<br>
                좌석 : ${seatNames}<br>
                결제금액 : ${totalPrice.toLocaleString()}원<br>
                상태 : <span class="status">${booking.status}</span>
              </div>

              <button class="cancel-btn" onclick="cancelTicket(${booking.bookingId})">
                예매 취소
              </button>
          `;

          container.appendChild(ticket);
      });
  }

  async function cancelTicket(bookingId) {
      const result = confirm("예매를 취소하시겠습니까?");

      if (!result) return;

      const response = await fetch(`/bookings/${bookingId}`, {
          method: "DELETE"
      });

      if (response.ok) {
          alert("예매가 취소되었습니다.");
          loadBookings();
      } else {
          alert("예매 취소 실패");
      }
  }

  loadBookings();
</script>
</body>
</html>
