<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대기열 페이지</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Apple SD Gothic Neo", sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            color: #222;
            text-align: center;
        }

        header {
            height: 70px;
            background: white;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 70px;
        }

    .logo {
        text-decoration: none;
        font-size: 26px;
        font-weight: bold;
        color: #2563eb;
}

        nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        .hero {
            background: white;
            padding: 55px 20px 40px;
            border-bottom: 1px solid #eee;
        }

        .hero h1 {
            font-size: 34px;
            margin-bottom: 12px;
        }

        .hero p {
            color: #777;
            font-size: 16px;
        }

        .container {
            width: 430px;
            margin: 55px auto;
            background: white;
            border-radius: 20px;
            padding: 40px 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        .info-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px;
            margin-bottom: 18px;
        }

        .label {
            font-size: 15px;
            color: #666;
            margin-bottom: 10px;
        }

        .value {
            font-size: 34px;
            font-weight: bold;
            color: #2563eb;
        }

        .notice {
            margin-top: 24px;
            font-size: 15px;
            line-height: 1.7;
            color: #555;
        }

        .ready {
            color: #16a34a;
            font-weight: bold;
            font-size: 21px;
            margin-top: 25px;
        }

        .enter-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #3b82f6;
            color: white;
            cursor: pointer;
            display: none;
            transition: 0.3s;
        }

        .enter-btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }
    </style>
  <script src="/js/app.js"></script>
  <link rel="stylesheet" href="/css/common.css">
</head>

<body>

<header>
    <a href="mainpage.html" class="logo">QuickTicket</a>

    <nav>
        <a href="mypage.html">마이페이지</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
    </nav>
</header>

<section class="hero">
    <h1 id="performanceTitle">JH CONCERT</h1>
    <p>서버에서 입장 순서를 확인하고 있습니다</p>
</section>

<div class="container">

    <div class="title">대기열 안내</div>

    <div class="info-box">
        <div class="label">내 앞 대기 인원</div>
        <div class="value" id="peopleAhead">확인 중</div>
    </div>

    <div class="info-box">
        <div class="label">예상 남은 시간</div>
        <div class="value" id="remainingTime">확인 중</div>
    </div>

    <div class="notice" id="noticeText">
        순서가 되면 좌석 선택 화면으로 이동할 수 있습니다.<br>
        대기열이 진행되는 동안 페이지를 새로고침하지 마세요.
    </div>

    <div class="ready" id="readyText"></div>

    <button class="enter-btn"
            id="enterBtn"
            onclick="enterBooking()">
        예매 페이지 입장
    </button>

</div>

<script>
const params=new URLSearchParams(location.search);
const performanceId=params.get('performanceId');
const peopleAhead=document.getElementById('peopleAhead');
const remainingTime=document.getElementById('remainingTime');
const readyText=document.getElementById('readyText');
const enterBtn=document.getElementById('enterBtn');
const noticeText=document.getElementById('noticeText');
let queueId,timer;
async function checkQueue() {
  try {
    const res=await fetch(`/queue/check?queueId=${queueId}`);const data=await res.json();
    peopleAhead.textContent=data.peopleAhead+'명';
    const left=data.expiresAt ? Math.max(0,Math.floor((Date.parse(data.expiresAt+'Z')-Date.now())/1000)) : 0;
    if(data.status==='ALLOWED' && left>0) {
      readyText.textContent='입장 가능합니다.';remainingTime.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
      noticeText.textContent='제한 시간 안에 좌석을 선택해주세요.';enterBtn.style.display='block';
    } else if(data.status==='EXPIRED' || (data.status==='ALLOWED' && left===0)) {
      clearInterval(timer);enterBtn.style.display='none';readyText.textContent='입장 시간이 만료되었습니다.';
      noticeText.textContent='페이지를 새로고침하여 다시 대기해주세요.';
    } else { remainingTime.textContent='순서 대기 중';enterBtn.style.display='none'; }
  } catch(e) {clearInterval(timer);showApiError(e.message);}
}
async function enterBooking() {
  try {await fetch(`/queue/enter?queueId=${queueId}`,{method:'POST'});location.href='seat.html?performanceId='+performanceId;}
  catch(e) {showApiError(e.message);}
}
(async()=>{
  if(!performanceId) {location.href='mainpage.html';return;}
  try {
    const perf=await (await fetch('/performances/'+performanceId)).json();
    document.getElementById('performanceTitle').textContent=perf.title;
    const entry=await (await fetch('/queue/join?performanceId='+performanceId,{method:'POST'})).json();
    queueId=entry.id;await checkQueue();timer=setInterval(checkQueue,2000);
  } catch(e) {showApiError(e.message);}
})();
</script>

</body>
</html>
