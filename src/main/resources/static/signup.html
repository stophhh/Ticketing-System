<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>

        *{
            box-sizing: border-box;
            font-family: "Apple SD Gothic Neo", sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 400px;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #222;
        }

        .sub-text{
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus{
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 8px rgba(59,130,246,0.2);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .signup-btn{
            background: #3b82f6;
            color: white;
            margin-top: 10px;
        }

        .signup-btn:hover{
            background: #2563eb;
        }

        .check-btn {
            background: #e8f1ff;
            color: #2563eb;
            margin-bottom: 15px;
        }

        .check-btn:hover{
            background: #dbeafe;
        }

        #message {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>회원가입</h1>
    <div class="sub-text">
        QuickTicket 계정을 생성하세요
    </div>

    <input type="text" id="name" placeholder="이름">

    <input type="tel" id="phone" placeholder="전화번호">

    <input type="date" id="birth">

    <input type="email" id="email" placeholder="이메일">

    <input type="text" id="username" placeholder="아이디">

    <button class="check-btn"
            onclick="checkUsername()">
        아이디 중복 확인
    </button>

    <input type="password"
           id="password"
           placeholder="비밀번호">

    <input type="password"
           id="confirmPassword"
           placeholder="비밀번호 재입력">

    <button class="signup-btn"
            onclick="signup()">
        회원가입
    </button>

    <p id="message"></p>

</div>

<script>

    let isUsernameChecked = false;

    async function checkUsername() {

        const username =
            document.getElementById("username").value;

        if (!username) {

            showMessage("아이디를 입력하세요", "red");
            return;
        }

        try {

            const res =
                await fetch(`/api/users/check?username=${username}`);

            if (res.ok) {

                const data = await res.text();

                if (data === "duplicate") {

                    showMessage("이미 사용 중인 아이디입니다", "red");
                    isUsernameChecked = false;

                } else {

                    showMessage("사용 가능한 아이디입니다", "green");
                    isUsernameChecked = true;
                }
            }

        } catch (e) {

            showMessage("중복 확인 실패", "red");
        }
    }

    async function signup() {

        const name =
            document.getElementById("name").value;

        const phone =
            document.getElementById("phone").value;

        const birth =
            document.getElementById("birth").value;

        const email =
            document.getElementById("email").value;

        const username =
            document.getElementById("username").value;

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if(password !== confirmPassword){

            showMessage("비밀번호가 일치하지 않습니다", "red");
            return;
        }

        if(!isUsernameChecked){

            showMessage("아이디 중복 확인을 해주세요", "red");
            return;
        }

        try {

            const response =
                await fetch("/api/users/signup", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    name: name,
                    phone: phone,
                    birth: birth,
                    email: email,
                    username: username,
                    password: password
                })
            });

            if(!response.ok){

                const errorText = await response.text();

                showMessage(
                    "회원가입 실패 : " + errorText,
                    "red"
                );

                return;
            }

            showMessage("회원가입 성공!", "green");

        } catch (e) {

            showMessage("서버 오류 발생", "red");
        }
    }

    function showMessage(msg, color){

        const el = document.getElementById("message");

        el.innerText = msg;
        el.style.color = color;
    }

</script>

</body>
</html>
