<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>좌석 선택 - QuickTicket</title>

    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: #f4f7fb;
          color: #222;
        }

        /* ── Header ── */
        header {
          height: 64px;
          background: #fff;
          border-bottom: 1px solid #eee;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 48px;
          flex-shrink: 0;
        }

        .logo {
          text-decoration: none;
          font-size: 22px;
          font-weight: 700;
          color: #2563eb;
        }

        nav { display: flex; gap: 24px; }
        nav a {
          text-decoration: none;
          color: #555;
          font-size: 14px;
          font-weight: 600;
          transition: color 0.2s;
        }
        nav a:hover { color: #111; }

        /* ── Hero ── */
        .hero {
          background: #fff;
          border-bottom: 1px solid #eee;
          padding: 36px 20px 28px;
          text-align: center;
        }
        .hero h1 {
          font-size: 26px;
          font-weight: 700;
          color: #111;
          margin-bottom: 6px;
        }
        .hero p {
          font-size: 14px;
          color: #888;
        }

        /* ── Main ── */
        main {
          flex: 1;
          display: flex;
          justify-content: center;
          padding: 40px 16px;
        }

        /* ── Card ── */
        .card {
          background: #fff;
          border-radius: 20px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
          padding: 40px 36px;
          width: 100%;
          max-width: 620px;
          text-align: center;
        }

        /* ── Stage ── */
        .screen {
          width: 75%;
          margin: 0 auto 32px;
          padding: 12px;
          background: #eff6ff;
          color: #2563eb;
          border-radius: 10px;
          font-size: 13px;
          font-weight: 700;
          letter-spacing: 2px;
        }

        /* ── Seats ── */
        #seats {
          display: flex;
          flex-wrap: wrap;
          justify-content: center;
          gap: 8px;
          margin-bottom: 4px;
        }

        .seat {
          width: 46px;
          height: 46px;
          border: none;
          border-radius: 10px;
          cursor: pointer;
          font-size: 12px;
          font-weight: 700;
          transition: background 0.15s, transform 0.15s;
        }

        .available {
          background: #dbeafe;
          color: #2563eb;
        }
        .available:hover {
          background: #bfdbfe;
          transform: translateY(-2px);
        }

        .selected {
          background: #3b82f6;
          color: #fff;
        }

        .booked {
          background: #e5e7eb;
          color: #aaa;
          cursor: not-allowed;
        }

        /* ── Legend ── */
        .legend {
          display: flex;
          justify-content: center;
          gap: 20px;
          margin: 24px 0;
          font-size: 13px;
          color: #666;
        }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .legend-box {
          width: 14px;
          height: 14px;
          border-radius: 4px;
        }
        .legend-box.available { background: #dbeafe; }
        .legend-box.selected  { background: #3b82f6; }
        .legend-box.booked    { background: #e5e7eb; }

        /* ── Summary ── */
        .summary {
          background: #f8fafc;
          border: 1px solid #e5e7eb;
          border-radius: 14px;
          padding: 18px 22px;
          text-align: left;
          font-size: 14px;
        }
        .summary-row {
          display: flex;
          justify-content: space-between;
          line-height: 2;
        }
        .summary-row .label { color: #888; }
        .summary-row .value { font-weight: 700; color: #111; }

        /* ── Message ── */
        #message {
          min-height: 20px;
          margin-top: 14px;
          font-size: 13px;
          font-weight: 600;
          color: #dc2626;
        }

        /* ── Pay Button ── */
        .pay-btn {
          width: 100%;
          height: 48px;
          margin-top: 20px;
          border: none;
          border-radius: 12px;
          background: #3b82f6;
          color: #fff;
          font-size: 16px;
          font-weight: 700;
          cursor: pointer;
          transition: background 0.2s, transform 0.15s;
        }
        .pay-btn:hover { background: #2563eb; transform: translateY(-1px); }
        .pay-btn:active { transform: translateY(0); }
        .pay-btn:disabled {
          background: #cbd5e1;
          cursor: not-allowed;
          transform: none;
        }
    </style>
</head>

<body>

<header>
    <a href="mainpage.html" class="logo">QuickTicket</a>
    <nav>
        <a href="mypage.html">마이페이지</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <a href="#">고객센터</a>
    </nav>
</header>

<section class="hero">
    <h1>좌석 선택</h1>
    <p>원하는 좌석을 선택한 뒤 결제 단계로 이동하세요</p>
</section>

<main>
    <div class="card">

        <div class="screen">S T A G E</div>

        <div id="seats"></div>

        <div class="legend">
            <div class="legend-item"><div class="legend-box available"></div> 선택 가능</div>
            <div class="legend-item"><div class="legend-box selected"></div> 선택됨</div>
            <div class="legend-item"><div class="legend-box booked"></div> 예매 불가</div>
        </div>

        <div class="summary">
            <div class="summary-row">
                <span class="label">최대 예매 가능</span>
                <span class="value">4매</span>
            </div>
            <div class="summary-row">
                <span class="label">선택한 좌석 수</span>
                <span class="value" id="selectedCount">0매</span>
            </div>
            <div class="summary-row">
                <span class="label">선택한 좌석</span>
                <span class="value" id="selectedSeats">없음</span>
            </div>
            <div class="summary-row">
                <span class="label">총 금액</span>
                <span class="value" style="color: #2563eb;" id="totalAmount">0원</span>
            </div>
        </div>

        <div id="message"></div>

        <button class="pay-btn" id="payBtn" onclick="goToPayment()" disabled>
            결제하기
        </button>

    </div>
</main>

<script>
    const params        = new URLSearchParams(location.search);
    const performanceId = params.get("performanceId");
    const userId        = localStorage.getItem("userId");

    if (!userId) {
      alert("로그인 후 좌석을 선택할 수 있습니다.");
      location.href = "login.html";
    }

    if (!performanceId) {
      alert("공연 정보가 없습니다.");
      location.href = "mainpage.html";
    }

    const maxTickets      = 4;
    const seatsDiv        = document.getElementById("seats");
    const selectedCountEl = document.getElementById("selectedCount");
    const selectedSeatsEl = document.getElementById("selectedSeats");
    const totalAmountEl   = document.getElementById("totalAmount");
    const messageEl       = document.getElementById("message");
    const payBtn          = document.getElementById("payBtn");

    let selectedSeats = [];

    async function loadSeats() {
      const response = await fetch(`/seats/performance/${performanceId}`);
      const seats    = await response.json();

      seatsDiv.innerHTML = "";

      seats.forEach(seat => {
        const btn = document.createElement("button");
        btn.classList.add("seat");
        btn.innerText        = seat.seatNumber;
        btn.dataset.id       = seat.id;
        btn.dataset.name     = seat.seatNumber;
        btn.dataset.price    = seat.price;

        if (seat.status === "AVAILABLE") {
          btn.classList.add("available");
          btn.onclick = () => toggleSeat(btn, seat);
        } else {
          btn.classList.add("booked");
          btn.disabled = true;
        }

        seatsDiv.appendChild(btn);
      });
    }

    function toggleSeat(btn, seat) {
      const alreadySelected = selectedSeats.some(s => s.id === seat.id);

      if (!alreadySelected) {
        if (selectedSeats.length >= maxTickets) {
          showMessage("최대 4매까지만 예매할 수 있습니다.");
          return;
        }
        btn.classList.replace("available", "selected");
        selectedSeats.push({ id: seat.id, name: seat.seatNumber, price: seat.price });
      } else {
        btn.classList.replace("selected", "available");
        selectedSeats = selectedSeats.filter(s => s.id !== seat.id);
        showMessage("");
      }

      updateSummary();
    }

    function updateSummary() {
      selectedCountEl.innerText = selectedSeats.length + "매";
      selectedSeatsEl.innerText = selectedSeats.length === 0
        ? "없음"
        : selectedSeats.map(s => s.name).join(", ");

      const total = selectedSeats.reduce((sum, s) => sum + Number(s.price), 0);
      totalAmountEl.innerText = total.toLocaleString() + "원";

      payBtn.disabled = selectedSeats.length === 0;
    }

    function showMessage(msg) {
      messageEl.innerText = msg;
    }

    async function goToPayment() {
      if (selectedSeats.length === 0) { showMessage("좌석을 먼저 선택해주세요."); return; }

      try {
        for (const seat of selectedSeats) {
          const response = await fetch(`/seats/${seat.id}/hold?userId=${userId}`, { method: "POST" });
          const result   = await response.text();
          if (!result.includes("성공")) { showMessage(result); return; }
        }

        const seatIds     = selectedSeats.map(s => s.id).join(",");
        const totalAmount = selectedSeats.reduce((sum, s) => sum + Number(s.price), 0);

        location.href = `payment.html?performanceId=${performanceId}&seatIds=${seatIds}&amount=${totalAmount}`;

      } catch (e) {
        console.error(e);
        showMessage("좌석 선점 중 오류가 발생했습니다.");
      }
    }

    loadSeats();
</script>

</body>
</html>
