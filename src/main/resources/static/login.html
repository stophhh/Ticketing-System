<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - QuickTicket</title>

    <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
          font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
        }

        body {
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          background: #f4f7fb;
        }

        /* ── Header ── */
        header {
          height: 64px;
          background: #fff;
          border-bottom: 1px solid #eee;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 48px;
          flex-shrink: 0;
        }

        .logo {
          text-decoration: none;
          font-size: 22px;
          font-weight: 700;
          color: #2563eb;
        }

        nav { display: flex; gap: 24px; }
        nav a {
          text-decoration: none;
          color: #555;
          font-size: 14px;
          font-weight: 600;
          transition: color 0.2s;
        }
        nav a:hover { color: #111; }

        /* ── Main ── */
        main {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 48px 16px;
        }

        /* ── Card ── */
        .card {
          background: #fff;
          border-radius: 20px;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
          padding: 40px 36px;
          width: 100%;
          max-width: 380px;
        }

        .card-header {
          text-align: center;
          margin-bottom: 28px;
        }
        .card-header h1 {
          font-size: 26px;
          font-weight: 700;
          color: #111;
          margin-bottom: 6px;
        }
        .card-header p {
          font-size: 13px;
          color: #888;
        }

        /* ── Form ── */
        .field {
          margin-bottom: 14px;
        }
        .field label {
          display: block;
          font-size: 13px;
          font-weight: 600;
          color: #555;
          margin-bottom: 6px;
        }
        .field input {
          width: 100%;
          height: 44px;
          padding: 0 14px;
          border: 1px solid #dcdcdc;
          border-radius: 12px;
          font-size: 14px;
          color: #111;
          background: #fff;
          transition: border-color 0.2s, box-shadow 0.2s;
          outline: none;
        }
        .field input:focus {
          border-color: #3b82f6;
          box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* ── Button ── */
        .login-btn {
          width: 100%;
          height: 44px;
          margin-top: 6px;
          border: none;
          border-radius: 12px;
          background: #3b82f6;
          color: #fff;
          font-size: 15px;
          font-weight: 700;
          cursor: pointer;
          transition: background 0.2s, transform 0.15s;
        }
        .login-btn:hover {
          background: #2563eb;
          transform: translateY(-1px);
        }
        .login-btn:active {
          transform: translateY(0);
        }

        /* ── Divider ── */
        .divider {
          display: flex;
          align-items: center;
          gap: 10px;
          margin: 20px 0;
        }
        .divider span {
          font-size: 12px;
          color: #aaa;
          white-space: nowrap;
        }
        .divider::before,
        .divider::after {
          content: '';
          flex: 1;
          height: 1px;
          background: #eee;
        }

        /* ── Signup ── */
        .signup-row {
          text-align: center;
          font-size: 13px;
          color: #666;
        }
        .signup-btn {
          background: none;
          border: none;
          color: #3b82f6;
          font-size: 13px;
          font-weight: 700;
          cursor: pointer;
          margin-left: 4px;
        }
        .signup-btn:hover { text-decoration: underline; }

        /* ── Result ── */
        #result {
          display: none;
          margin-top: 16px;
          font-size: 13px;
          background: #f5f7fa;
          border-radius: 12px;
          padding: 12px;
          max-height: 150px;
          overflow: auto;
          color: #444;
          line-height: 1.6;
          white-space: pre-wrap;
        }
    </style>
</head>

<body>

<header>
    <a href="mainpage.html" class="logo">QuickTicket</a>
    <nav>
        <a href="mypage.html">마이페이지</a>
        <a href="login.html">로그인</a>
        <a href="signup.html">회원가입</a>
        <a href="#">고객센터</a>
    </nav>
</header>

<main>
    <div class="card">

        <div class="card-header">
            <h1>QuickTicket</h1>
            <p>빠르고 간편한 공연 예매 서비스</p>
        </div>

        <div class="field">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="아이디 입력" />
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="비밀번호 입력" />
        </div>

        <button class="login-btn" onclick="login()">로그인</button>

        <div class="divider"><span>또는</span></div>

        <div class="signup-row">
            아직 회원이 아니신가요?
            <button class="signup-btn" onclick="location.href='signup.html'">회원가입</button>
        </div>

        <div id="result"></div>

    </div>
</main>

<script>
    async function login() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      const resultEl = document.getElementById("result");

      resultEl.style.display = "block";

      try {
        const response = await fetch("/users/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await response.text();

        if (result.trim() === "로그인 성공") {
          localStorage.setItem("userId", "1");
          localStorage.setItem("username", username);
          resultEl.innerText = "✅ 로그인 성공";

          const redirectUrl = localStorage.getItem("redirectUrl");
          if (redirectUrl) {
            localStorage.removeItem("redirectUrl");
            location.href = redirectUrl;
          } else {
            location.href = "mainpage.html";
          }
        } else {
          resultEl.innerText = "❌ 로그인 실패: " + result;
        }

      } catch (e) {
        resultEl.innerText = "⚠️ 서버 연결 오류";
      }
    }
</script>

</body>
</html>
