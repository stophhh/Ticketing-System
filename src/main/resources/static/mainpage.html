<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QuickTicket</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", Arial, sans-serif;
      background: #f8fafc;
      color: #111;
    }

    header {
      height: 70px;
      background: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 80px;
      border-bottom: 1px solid #eee;
    }

    .logo {
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
      color: #2563eb;
    }

    nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #444;
      font-weight: 600;
    }

    nav a:hover { color: #2563eb; }

    .hero {
      padding: 80px;
      text-align: center;
      background: white;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .hero p {
      color: #666;
      margin-bottom: 30px;
    }

    .search-box {
      width: 500px;
      max-width: 90%;
      margin: 0 auto 30px;
      display: flex;
      border: 1px solid #ddd;
      border-radius: 10px;
      overflow: hidden;
    }

    .search-box input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
    }

    .search-box button {
      padding: 0 20px;
      border: none;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    .category-nav a {
      cursor: pointer;
    }

    .section {
      padding: 60px 80px;
    }

    .section-title {
      font-size: 26px;
      margin-bottom: 25px;
    }

    .card-list {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
    }

    .card {
      background: white;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #eee;
      transition: 0.2s;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .poster img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      background: #e5e7eb;
    }

    .card-content {
      padding: 18px;
    }

    .card-content h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .date {
      color: #888;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .category {
      display: inline-block;
      margin-bottom: 10px;
      padding: 4px 9px;
      border-radius: 999px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: bold;
    }

    .reserve-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .reserve-btn:hover {
      background: #1d4ed8;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #777;
      padding: 40px;
      background: white;
      border-radius: 14px;
      border: 1px solid #eee;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #888;
      border-top: 1px solid #eee;
      margin-top: 50px;
    }

    @media (max-width: 900px) {
      .card-list { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 600px) {
      header { padding: 0 20px; }
      .section { padding: 40px 20px; }
      .hero { padding: 40px 20px; }
      .card-list { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<header>
  <a href="mainpage.html" class="logo">QuickTicket</a>

  <nav>
    <a href="mypage.html">마이페이지</a>
    <a href="login.html">로그인</a>
    <a href="signup.html">회원가입</a>
    <a href="admin.html">관리자</a>
  </nav>
</header>

<section class="hero">
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="공연명을 검색하세요">
    <button onclick="searchPerformances()">검색</button>
  </div>

  <h1>원하는 공연을 빠르게 예매하세요</h1>
  <p>콘서트, 뮤지컬, 연극 티켓을 한 곳에서</p>

  <nav class="category-nav">
    <a onclick="filterCategory('전체')">전체</a>
    <a onclick="filterCategory('콘서트')">콘서트</a>
    <a onclick="filterCategory('뮤지컬')">뮤지컬</a>
    <a onclick="filterCategory('팬미팅')">팬미팅</a>
    <a onclick="filterCategory('연극')">연극</a>
  </nav>
</section>

<section class="section">
  <h2 class="section-title">인기 공연</h2>

  <div class="card-list" id="performanceList"></div>
</section>

<footer>
  © 2026 QuickTicket
</footer>

<script>
  let allPerformances = [];

  async function loadPerformances() {
    try {
      const response = await fetch("/performances");

      if (!response.ok) {
        throw new Error("공연 목록 조회 실패");
      }

      allPerformances = await response.json();
      renderPerformances(allPerformances);

    } catch (error) {
      console.error(error);
      document.getElementById("performanceList").innerHTML =
        `<div class="empty">공연 목록을 불러오지 못했습니다.</div>`;
    }
  }

  function renderPerformances(performances) {
    const list = document.getElementById("performanceList");
    list.innerHTML = "";

    if (!performances || performances.length === 0) {
      list.innerHTML = `<div class="empty">등록된 공연이 없습니다.</div>`;
      return;
    }

    performances.forEach(performance => {
      const card = document.createElement("div");
      card.className = "card";

      const dateText = performance.performanceDate
        ? new Date(performance.performanceDate).toLocaleString("ko-KR")
        : "공연일 미정";

      card.innerHTML = `
        <div class="poster">
          <img src="${performance.posterUrl || '/images/default.jpg'}" alt="공연 포스터">
        </div>
        <div class="card-content">
          <span class="category">${performance.category || '공연'}</span>
          <h3>${performance.title || '공연명 없음'}</h3>
          <div class="date">${dateText} · ${performance.place || '장소 미정'}</div>
          <button class="reserve-btn" onclick="location.href='detail.html?id=${performance.performanceId}'">
            예매하기
          </button>
        </div>
      `;

      list.appendChild(card);
    });
  }

  function searchPerformances() {
    const keyword = document.getElementById("searchInput").value.trim();

    if (keyword === "") {
      renderPerformances(allPerformances);
      return;
    }

    const filtered = allPerformances.filter(p =>
      (p.title || "").toLowerCase().includes(keyword.toLowerCase())
    );

    renderPerformances(filtered);
  }

  function filterCategory(category) {
    if (category === "전체") {
      renderPerformances(allPerformances);
      return;
    }

    const filtered = allPerformances.filter(p =>
      (p.category || "") === category
    );

    renderPerformances(filtered);
  }

  document.getElementById("searchInput").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
      searchPerformances();
    }
  });

  loadPerformances();
</script>

</body>
</html>
