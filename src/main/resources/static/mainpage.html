<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>QuickTicket</title>

  <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: "Pretendard", Arial, sans-serif;
        background: #f8fafc;
        color: #111;
    }


    header {
        height: 70px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 80px;
        border-bottom: 1px solid #eee;
    }

    .logo {
        font-size: 24px;
        font-weight: 900;
        color: #2563eb;
    }

    nav a {
        margin-left: 25px;
        text-decoration: none;
        color: #444;
        font-weight: 600;
    }

    nav a:hover {
        color: #2563eb;
    }


    .hero {
        padding: 80px;
        text-align: center;
        background: white;
    }

    .hero h1 {
        font-size: 40px;
        margin-bottom: 15px;
    }

    .hero p {
        color: #666;
        margin-bottom: 30px;
    }


    .search-box {
        width: 500px;
        max-width: 90%;
        margin: 0 auto;
        display: flex;
        border: 1px solid #ddd;
        border-radius: 10px;
        overflow: hidden;
    }

    .search-box input {
        flex: 1;
        padding: 14px;
        border: none;
        outline: none;
    }

    .search-box button {
        padding: 0 20px;
        border: none;
        background: #2563eb;
        color: white;
        cursor: pointer;
    }


    .section {
        padding: 60px 80px;
    }

    .section-title {
        font-size: 26px;
        margin-bottom: 25px;
    }


    .card-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 25px;
    }

    .card {
        background: white;
        border-radius: 14px;
        overflow: hidden;
        border: 1px solid #eee;
        transition: 0.2s;
    }

    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }


    .poster img {
        width: 100%;
        height: 250px;
        object-fit: cover;
    }


    .card-content {
        padding: 18px;
    }

    .card-content h3 {
        margin: 0 0 8px;
        font-size: 18px;
    }

    .date {
        color: #888;
        font-size: 14px;
        margin-bottom: 15px;
    }


    .reserve-btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
    }

    .reserve-btn:hover {
        background: #1d4ed8;
    }


    footer {
        text-align: center;
        padding: 30px;
        color: #888;
        border-top: 1px solid #eee;
        margin-top: 50px;
    }


    @media (max-width: 900px) {
        .card-list {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 600px) {
        header {
            padding: 0 20px;
        }

        .section {
            padding: 40px 20px;
        }

        .hero {
            padding: 40px 20px;
        }

        .card-list {
            grid-template-columns: 1fr;
        }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">QuickTicket</div>

  <nav>

    <a href="mypage.html">
      마이페이지
    </a>

    <a href="login.html">
      로그인
    </a>

    <a href="signup.html">
      회원가입
    </a>

    <a href="admin.html">
      관리자
    </a>

  </nav>
</header>

<section class="hero">
  <div class="search-box">
    <input type="text" placeholder="공연명을 검색하세요">
    <button>검색</button>
  </div>

  <h1>원하는 공연을 빠르게 예매하세요</h1>
  <p>콘서트, 뮤지컬, 연극 티켓을 한 곳에서</p>
  <nav>
    <a href="#">콘서트</a>
    <a href="#">뮤지컬</a>
    <a href="#">팬미팅</a>
    <a href="#">랭킹</a>
    <a href="#">티켓오픈소식</a>
  </nav>
</section>

<section class="section">
  <h2 class="section-title">인기 공연</h2>

  <div class="card-list">

    <div class="card">
      <div class="poster">
        <img src="/images/concert1.jpg">
      </div>
      <div class="card-content">
        <h3>NCT WISH CONCERT</h3>
        <div class="date">2026.06.15 · 서울 KSPO DOME</div>
        <button class="reserve-btn" onclick="location.href='detail.html?id=1'">예매하기</button>
      </div>
    </div>

    <div class="card">
      <div class="poster">
        <img src="/images/musical.jpg">
      </div>
      <div class="card-content">
        <h3>뮤지컬 레미제라블</h3>
        <div class="date">2026.07.01 · 블루스퀘어</div>
        <button class="reserve-btn" onclick="location.href='detail.html?id=2'">예매하기</button>
      </div>
    </div>

    <div class="card">
      <div class="poster">
        <img src="/images/festival.jpg">
      </div>
      <div class="card-content">
        <h3>인디 밴드 페스티벌</h3>
        <div class="date">2026.06.28 · 대구 스타디움</div>
        <button class="reserve-btn" onclick="location.href='detail.html?id=3'">예매하기</button>
      </div>
    </div>

    <div class="card">
      <div class="poster">
        <img src="/images/classic.jpg">
      </div>
      <div class="card-content">
        <h3>클래식 오케스트라</h3>
        <div class="date">2026.08.10 · 예술의전당</div>
        <button class="reserve-btn" onclick="location.href='detail.html?id=4'">예매하기</button>
      </div>
    </div>

  </div>
</section>

<footer>
  © 2026 QuickTicket
</footer>

</body>
</html>
