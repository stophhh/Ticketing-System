name: Java integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test bootJar --no-daemon
      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

  mysql-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ticketing_test
          MYSQL_ROOT_PASSWORD: local-ci-test-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -plocal-ci-test-only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew mysqlTest --no-daemon
        env:
          TICKETING_TEST_MYSQL_URL: jdbc:mysql://127.0.0.1:3306/ticketing_test?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
          TICKETING_TEST_MYSQL_USER: root
          TICKETING_TEST_MYSQL_PASSWORD: local-ci-test-only
      - name: MySQL test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-test-report
          path: build/reports/tests/mysqlTest
