plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Ticketing'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    runtimeOnly 'com.mysql:mysql-connector-j'
    runtimeOnly 'com.h2database:h2'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Only a disposable database named ticketing_test is accepted: this task recreates its schema.
tasks.register('mysqlTest', Test) {
    description = 'Run integration tests against a disposable local MySQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    def testUrl = providers.environmentVariable('TICKETING_TEST_MYSQL_URL')
    doFirst {
        def url = testUrl.orNull
        if (url == null || !(url ==~ /jdbc:mysql:\/\/(localhost|127\.0\.0\.1):[0-9]+\/ticketing_test(\?.*)?/)) {
            throw new GradleException('Set TICKETING_TEST_MYSQL_URL to a disposable localhost database named ticketing_test.')
        }
        systemProperty 'spring.datasource.url', url
        systemProperty 'spring.datasource.username', providers.environmentVariable('TICKETING_TEST_MYSQL_USER').getOrElse('root')
        systemProperty 'spring.datasource.password', providers.environmentVariable('TICKETING_TEST_MYSQL_PASSWORD').getOrElse('')
        systemProperty 'spring.datasource.driver-class-name', 'com.mysql.cj.jdbc.Driver'
    }
}
